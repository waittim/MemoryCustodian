name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: memory-custodian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: PYTHONPATH=cli python -m unittest discover -s tests
      - run: PYTHONPATH=cli python scripts/check-skill-evals.py
      - run: python scripts/check-adapter-contracts.py
      - run: python scripts/check-erasure-language.py
      - run: python scripts/check-version.py
      - run: PYTHONPATH=cli python -m memory_custodian.main check --security --privacy
      - run: PYTHONPATH=cli python -m memory_custodian.main audit --all
      - run: PYTHONPATH=cli python -m memory_custodian.main audit --transactions
      - name: Check committed changes for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              BASE_SHA="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)"
            else
              BASE_SHA="$(git merge-base "$GITHUB_SHA" "origin/$DEFAULT_BRANCH")"
            fi
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  windows-smoke:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_windows_smoke.py
        env:
          PYTHONPATH: cli
      - run: python scripts/check-skill-evals.py
        env:
          PYTHONPATH: cli
      - run: python scripts/check-adapter-contracts.py
      - run: python scripts/check-erasure-language.py
      - run: python scripts/check-version.py
      - run: python -m unittest tests.test_protocol_08 tests.test_transactions_08
        env:
          PYTHONPATH: cli
      - run: python -m memory_custodian.main check
        env:
          PYTHONPATH: cli
      - run: python -m memory_custodian.main audit --all
        env:
          PYTHONPATH: cli
      - run: python -m memory_custodian.main audit --transactions
        env:
          PYTHONPATH: cli
      - name: Check committed changes for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              BASE_SHA="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)"
            else
              BASE_SHA="$(git merge-base "$GITHUB_SHA" "origin/$DEFAULT_BRANCH")"
            fi
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
